<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tetris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@300;400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Game Header -->
        <div class="game-header">
            <h1 class="game-title">NEON TETRIS</h1>
            <div class="score-display">
                <div class="score-item">
                    <span class="label">SCORE</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="score-item">
                    <span class="label">LEVEL</span>
                    <span id="level" class="value">1</span>
                </div>
                <div class="score-item">
                    <span class="label">LINES</span>
                    <span id="lines" class="value">0</span>
                </div>
            </div>
        </div>

        <!-- Game Area -->
        <div class="game-area">
            <div class="game-board">
                <canvas id="gameCanvas" width="300" height="600"></canvas>
                <div class="game-overlay" id="gameOverlay">
                    <div class="overlay-content">
                        <h2 id="overlayTitle">NEON TETRIS</h2>
                        <p id="overlayText">Press SPACE to start</p>
                        <div class="controls-info">
                            <p>↑ Rotate • ← → Move • ↓ Drop • SPACE Hold</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="side-panel">
                <div class="next-piece">
                    <h3>NEXT</h3>
                    <canvas id="nextCanvas" width="120" height="120"></canvas>
                </div>
                
                <div class="game-controls">
                    <button id="pauseBtn" class="control-btn">PAUSE</button>
                    <button id="restartBtn" class="control-btn">RESTART</button>
                </div>
            </div>
        </div>

        <!-- Mobile Controls -->
        <div class="mobile-controls" id="mobileControls">
            <div class="control-row">
                <button class="mobile-btn" id="rotateBtn">↻</button>
                <button class="mobile-btn" id="holdBtn">HOLD</button>
            </div>
            <div class="control-row">
                <button class="mobile-btn" id="leftBtn">←</button>
                <button class="mobile-btn" id="downBtn">↓</button>
                <button class="mobile-btn" id="rightBtn">→</button>
            </div>
        </div>
    </div>

    <script src="tetris.js"></script>
    <script src="game.js"></script>
</body>
</html>
